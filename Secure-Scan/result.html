<!DOCTYPE html>
<html>

<head>

<title>Results</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
background:#0f172a;
padding:40px;
color:white;
}

.card{
background:#1e293b;
padding:30px;
border-radius:20px;
}

table{
color:white !important;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>
Scan Results
</h2>

<hr>

{% if result.error %}

<div class="alert alert-danger">

{{ result.error }}

</div>

{% else %}

<table class="table table-dark">

<tr>
<th>URL</th>
<td>{{ result.url }}</td>
</tr>

<tr>
<th>Status Code</th>
<td>{{ result.status }}</td>
</tr>

<tr>
<th>Server</th>
<td>{{ result.server }}</td>
</tr>

<tr>
<th>Content Type</th>
<td>{{ result.content_type }}</td>
</tr>

<tr>
<th>HSTS</th>
<td>{{ result.hsts }}</td>
</tr>

<tr>
<th>CSP</th>
<td>{{ result.csp }}</td>
</tr>

<tr>
<th>X-Frame-Options</th>
<td>{{ result.xframe }}</td>
</tr>

</table>

{% endif %}

<a href="/"
class="btn btn-primary">

New Scan

</a>

</div>

</div>

</body>
</html>
