<!DOCTYPE html>
<html>

<head>

<title>SecureScan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
background:#0f172a;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.card{
width:700px;
padding:40px;
background:#1e293b;
border:none;
border-radius:20px;
}

</style>

</head>

<body>

<div class="card">

<h1 class="text-center">
🛡 SecureScan
</h1>

<p class="text-center">
Website Security Dashboard
</p>

<form action="/scan"
method="POST">

<input
type="text"
name="url"
class="form-control mb-3"
placeholder="google.com or https://google.com"
required>

<button
class="btn btn-success w-100">

Analyze Website

</button>

</form>

</div>

</body>
</html>
